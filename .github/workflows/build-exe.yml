name: Build Electron EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build EXE
        run: |
          cd electron
          npm run make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutonomousAgent-win32
          path: electron/out/make/**/*
