name: Build Docker & Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autonomous-agent:latest

      - name: Export Docker image to tar
        run: |
          docker save autonomous-agent:latest -o autonomous-agent.tar

      - name: Compress to zip
        run: |
          zip autonomous-agent-docker.zip autonomous-agent.tar Dockerfile docker-compose.yml 2>/dev/null || true
          zip autonomous-agent-docker.zip autonomous-agent.tar Dockerfile

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-agent-docker
          path: autonomous-agent-docker.zip
          retention-days: 30

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-agent-tar
          path: autonomous-agent.tar
          retention-days: 30
